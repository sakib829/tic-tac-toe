<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, responsive Tic-Tac-Toe game built with HTML, CSS, and vanilla JavaScript." />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">

    <!-- ===================== MAIN MENU SCREEN ===================== -->
    <section id="menu-screen" class="screen is-active" aria-labelledby="menu-title">
      <div class="card menu-card">
        <h1 id="menu-title" class="title">Tic-Tac-Toe</h1>
        <p class="subtitle">A classic game of X and O</p>
        <div class="menu-buttons">
          <button id="single-player-btn" class="btn btn-primary" type="button">
            Single Player
          </button>
          <button id="multiplayer-btn" class="btn btn-secondary" type="button">
            Multiplayer
          </button>
        </div>
      </div>
    </section>

    <!-- ===================== GAME SCREEN ===================== -->
    <section id="game-screen" class="screen" aria-labelledby="game-title">
      <div class="card game-card">
        <h2 id="game-title" class="game-heading">Tic-Tac-Toe</h2>

        <!-- Shows whose turn it is -->
        <p id="status" class="status" role="status" aria-live="polite">Your Turn (X)</p>

        <!-- The 3x3 board is generated by JavaScript -->
        <div id="board" class="board" role="group" aria-label="Tic Tac Toe board"></div>

        <!-- Result message panel (hidden until the game ends) -->
        <p id="result" class="result is-hidden" role="alert" aria-live="assertive"></p>

        <div class="game-buttons">
          <button id="play-again-btn" class="btn btn-primary" type="button">
            Play Again
          </button>
          <button id="main-menu-btn" class="btn btn-secondary" type="button">
            Main Menu
          </button>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
